server.port=8081
spring.application.name=30_JPA_Member

# mysql set
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hanyong?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate 설정을 명시적으로 설정
spring.jpa.properties.hibernate.show_sql=true
# SQL 로그를 예쁘게 출력
spring.jpa.properties.hibernate.format_sql=true
# 간단하게 SQL 로그 출력
spring.jpa.show-sql=true

# ── [커넥션 풀 설정 - HikariCP] ───────
spring.datasource.hikari.minimum-idle=5       
spring.datasource.hikari.maximum-pool-size=10 
spring.datasource.hikari.auto-commit=true     
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.idle-timeout=600000  
spring.datasource.hikari.connection-timeout=30000 
spring.datasource.hikari.max-lifetime=1800000 


# none, create, create-drop, update, validate
spring.jpa.properties.hibernate.hbm2ddl.auto=update


# Swagger UI 기본 경로 변경 (선택)
springdoc.swagger-ui.path=/swagger-ui
# API 문서 JSON 경로 (기본: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Swagger UI 옵션
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=true
